version: '3.9'

services:
  api:
    build:
      context: ../backend
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
      - postgres
      - redis

  worker:
    build:
      context: ../backend
    env_file:
      - ../.env
    command: celery -A app.workers.celery_app.celery_app worker -l info
    depends_on:
      - api
      - redis

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  neo4j_data:
  pg_data:
